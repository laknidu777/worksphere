services:
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worksphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worksphere_local_secret}
      POSTGRES_DB: ${POSTGRES_DB:-worksphere}
      TZ: Asia/Colombo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worksphere} -d ${POSTGRES_DB:-worksphere}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-network

  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-network

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    container_name: worksphere-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${API_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-worksphere}:${POSTGRES_PASSWORD:-worksphere_local_secret}@postgres:5432/${POSTGRES_DB:-worksphere}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENABLE_MOCK_AUTH: "true"
      SHUTDOWN_TIMEOUT_SECONDS: "10"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - worksphere-network

  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.web
    container_name: worksphere-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - worksphere-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  worksphere-network:
    driver: bridge
