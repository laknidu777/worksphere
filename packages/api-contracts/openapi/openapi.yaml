openapi: 3.1.0
info:
  title: WorkSphere API
  version: 0.1.0
  description: >
    WorkSphere is a Sri Lanka-first, subscription-based, multi-tenant business
    operations SaaS platform.
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.worksphere.lk
    description: Production API

paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns 200 OK when the HTTP server process is running and alive.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness Probe
      description: Returns 200 OK when database and downstream dependencies are healthy; 503 otherwise.
      responses:
        '200':
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Downstream dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/modules:
    get:
      summary: List Registered Modules
      description: Returns active business modules and regional defaults for the tenant.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulesResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: External Cognito OIDC access token verified by the backend.

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - timestamp
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: worksphere-api
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      required:
        - status
        - service
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          example: worksphere-api
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string

    ModulesResponse:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
        modules:
          type: array
          items:
            type: string
        currency_default:
          type: string
          example: LKR
        timezone_default:
          type: string
          example: Asia/Colombo
